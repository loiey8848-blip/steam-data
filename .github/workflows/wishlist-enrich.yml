name: Wishlist Price Enrich

on:
  workflow_run:
    workflows: ["Steam Data Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wishlist-price-enrich
  cancel-in-progress: true

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Enrich wishlist with Steam CN prices
        run: python3 scripts/wishlist_enrich.py
      - name: Commit enriched wishlist
        run: |
          git config user.name "steam-data-bot"
          git config user.email "steam-data-bot@users.noreply.github.com"
          git add data/wishlist.json data/wishlist-under-20.json
          if git diff --cached --quiet; then
            echo "No wishlist metadata changes."
          else
            git commit -m "Update wishlist Steam prices"
            git push
          fi
